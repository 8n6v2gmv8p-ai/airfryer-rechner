<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Airfryer Rechner</title>
  
  <!-- PWA & iOS Meta Tags -->
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent sorgt dafür, dass die App unter der Statusleiste liegt und den ganzen Screen ausnutzt -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Airfryer">
  
  <!-- App-Icon für Homescreen und Browser-Tab -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
        --bg-color: #121212;
        --container-bg: #1e1e1e;
        --card-bg: #252525;
        --box-bg: #2a2a2a;
        --text-main: #e0e0e0;
        --text-muted: #9e9e9e;
        --accent: #f5c518;
        --border: #333333;
    }

    /* Auf mobilen Displays füllt der Body den kompletten Bildschirm */
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        overflow-x: hidden;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: flex-start; /* Startet ganz oben, um Platz auszunutzen */
        box-sizing: border-box;
        overscroll-behavior-y: none;
    }

    /* Die Hauptbox nimmt auf Mobilgeräten 100% der Breite & Höhe ein und fängt unter der Safe Area an */
    .container {
        background-color: var(--container-bg);
        width: 100%;
        min-height: 100vh;
        min-height: -webkit-fill-available; /* Wichtig für iOS, um die Safari-Leisten-Höhe auszugleichen */
        padding: 24px;
        /* Safe Areas für iPhones mit Notch oder Dynamic Island */
        padding-top: calc(24px + env(safe-area-inset-top));
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        padding-left: calc(24px + env(safe-area-inset-left));
        padding-right: calc(24px + env(safe-area-inset-right));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }

    /* Auf Desktop-Monitoren oder Tablets bleibt das kompakte Kasten-Design */
    @media (min-width: 480px) {
        body {
            align-items: center; /* Zentriert die Box auf großen Bildschirmen wieder */
            padding: 20px;
        }
        .container {
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            min-height: auto;
            border: 1px solid var(--border);
            padding: 30px;
        }
    }

    /* Header mit Logo */
    .app-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 25px;
    }

    .app-logo {
        width: 36px;
        height: 36px;
        object-fit: contain;
    }

    h2 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
    }

    .toggle-buttons {
      display: flex;
      background: var(--box-bg);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 25px;
      border: 1px solid var(--border);
    }

    .toggle-buttons button {
      flex: 1;
      padding: 12px; /* Etwas größer für bessere mobile Erreichbarkeit */
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle-buttons button svg {
      opacity: 0.7;
    }

    .toggle-buttons button.active {
      background: var(--container-bg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    
    .toggle-buttons button.active svg {
      color: var(--accent);
      opacity: 1;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    label {
        font-size: 0.95rem;
        color: var(--text-muted);
    }

    .value-display {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-main);
        background: var(--bg-color);
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        min-width: 70px;
        text-align: center;
    }

    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }

    input[type=range]:focus {
        outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 28px; /* Etwas vergrößert für iPhone-Daumen */
        width: 28px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        margin-top: -12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 5px;
        cursor: pointer;
        background: var(--border);
        border-radius: 2px;
    }

    .airfryer-result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      margin-top: auto; /* Schiebt die Card nach unten, wenn Platz da ist, oder lässt sie fließen */
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .title {
      margin: 0 0 20px 0;
      font-size: 28px;
      color: var(--accent);
    }

    .stats-grid {
      display: flex;
      gap: 16px;
    }

    .stat-box {
      flex: 1;
      background: var(--box-bg);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .stat-label svg {
      color: var(--accent);
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .stat-value span {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="app-header">
      <img src="icon.png" alt="Logo" class="app-logo">
      <h2>Airfryer Rechner</h2>
    </div>
    
    <div class="toggle-buttons">
      <button class="active" id="btnUmluft" onclick="setProgram('umluft')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
          <path d="M12 8a2 2 0 0 0-2-2c-1.1 0-2-.9-2-2s.9-2 2-2 4 1.8 4 4v2Z"/>
          <path d="M12 16a2 2 0 0 0 2 2c1.1 0 2 .9 2 2s-.9 2-2 2-4-1.8-4-4v-2Z"/>
          <path d="M8 12a2 2 0 0 0-2 2c0 1.1-.9 2-2 2s-2-.9-2-2 1.8-4 4-4h2Z"/>
          <path d="M16 12a2 2 0 0 0 2-2c0-1.1.9-2 2-2s2 .9 2 2-1.8 4-4 4h-2Z"/>
        </svg>
        Umluft / Heißluft
      </button>
      <button id="btnOberUnter" onclick="setProgram('oberunter')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
        Ober-/Unterhitze
      </button>
    </div>

    <div class="form-group">
      <div class="header-row">
        <label for="ovenTemp">Backofen-Temperatur</label>
        <span class="value-display" id="tempDisplay">200 °C</span>
      </div>
      <input type="range" id="ovenTemp" value="200" min="50" max="300" step="5" oninput="updateUI()">
    </div>

    <div class="form-group">
      <div class="header-row">
        <label for="ovenTime">Backofen-Garzeit</label>
        <span class="value-display" id="timeDisplay">30 Min.</span>
      </div>
      <input type="range" id="ovenTime" value="30" min="1" max="240" step="1" oninput="updateUI()">
    </div>

    <div class="airfryer-result-card">
      <div class="subtitle">Airfryer Programm</div>
      <h1 class="title" id="resProgramName">Air Fry</h1>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
            TEMPERATUR
          </div>
          <div class="stat-value" id="resTemp">185<span>°C</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ZEIT
          </div>
          <div class="stat-value" id="resTime">24<span>min</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isUmluft = true;

    function setProgram(type) {
      if (type === 'umluft') {
        isUmluft = true;
        document.getElementById('btnUmluft').classList.add('active');
        document.getElementById('btnOberUnter').classList.remove('active');
      } else {
        isUmluft = false;
        document.getElementById('btnOberUnter').classList.add('active');
        document.getElementById('btnUmluft').classList.remove('active');
      }
      updateUI();
    }

    function updateUI() {
      const ovenTemp = parseInt(document.getElementById('ovenTemp').value);
      const ovenTime = parseInt(document.getElementById('ovenTime').value);
      
      document.getElementById('tempDisplay').textContent = ovenTemp + " °C";
      document.getElementById('timeDisplay').textContent = ovenTime + " Min.";

      let afTemp, afTime;

      if (isUmluft) {
        afTemp = ovenTemp - 15;
        afTime = Math.round(ovenTime * 0.80);
      } else {
        afTemp = ovenTemp - 35;
        afTime = Math.round(ovenTime * 0.75);
      }

      let program = "";
      if (afTemp <= 95) {
        program = "Dry";
        if (afTime < 30) afTime = 30; 
      } else if (afTemp >= 96 && afTemp <= 119) {
        program = "Reheat";
        if (afTime > 60) afTime = 60; 
      } else if (afTemp >= 120 && afTemp <= 204) {
        if (afTime > 60) {
          program = "Bake";
          if (afTime > 240) afTime = 240; 
        } else {
          program = "Air Fry";
        }
      } else if (afTemp >= 205 && afTemp <= 220) {
        program = "Roast";
        if (afTime > 60) afTime = 60; 
      } else if (afTemp > 220) {
        program = "Grill";
        afTemp = Math.min(afTemp, 230); 
        if (afTime > 60) afTime = 60; 
      }

      document.getElementById('resProgramName').textContent = program;
      document.getElementById('resTemp').innerHTML = `${afTemp}<span>°C</span>`;
      document.getElementById('resTime').innerHTML = `${afTime}<span>min</span>`;
    }

    updateUI();
  </script>
</body>
</html>
